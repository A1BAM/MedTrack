<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..600&amp;family=Newsreader:opsz,wght@6..72,300..500&amp;display=swap">
  <style>
    :root{
      --page:#F4F1EC; --surface:#FCFBF8; --ink:#282521; --ink-2:#645F59;
      --muted:#78736D; --grid:#DFDBD5; --axis:#C2BEB7; --accent:#447260;
      --wash:#DCECE5; --good:#447260; --danger:#9F5342; --on-accent:#FCFBF8;
      --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
      --display:'Newsreader',Georgia,'Times New Roman',serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--page);color:var(--ink);font-family:var(--ui);
      font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none} a:hover{color:var(--ink)}
    p,h1,h2,h3{margin:0}
    .num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:400}

    .screen{position:relative;width:390px;min-height:100%;background:var(--page);
      display:flex;flex-direction:column;overflow:hidden}
    .body{flex-grow:1;display:flex;flex-direction:column;gap:26px;padding:30px 20px 108px}
    .head{display:flex;flex-direction:column;gap:7px}
    h1{font-family:var(--display);font-size:29px;line-height:1.1;font-weight:400;letter-spacing:-0.01em}
    .sub{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
    .eyebrow{font-size:10.5px;font-weight:600;letter-spacing:0.11em;text-transform:uppercase;color:var(--muted)}

    .card{background:var(--surface);border:1px solid var(--grid);border-radius:20px;padding:18px}
    .stack{display:flex;flex-direction:column}
    .rowx{display:flex;align-items:center}

    .cta{height:86px;border-radius:24px;background:var(--accent);color:var(--on-accent);
      font-family:var(--ui);font-size:18px;font-weight:500;letter-spacing:0.005em;
      display:flex;align-items:center;justify-content:center;gap:11px;border:none;width:100%}
    .ghost{height:54px;border-radius:18px;background:transparent;color:var(--accent);
      border:1px solid var(--accent);font-family:var(--ui);font-size:15px;font-weight:500;
      display:flex;align-items:center;justify-content:center;gap:9px;width:100%}
    .quiet{font-size:13.5px;color:var(--ink-2);text-decoration:underline;
      text-decoration-color:var(--axis);text-underline-offset:3px}

    .divide{border-top:1px solid var(--grid)}
    .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;
      border-radius:999px;border:1px solid var(--accent);color:var(--accent);
      font-size:12.5px;font-weight:500;letter-spacing:0.01em}

    .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--surface);
      border-top:1px solid var(--grid);display:grid;grid-template-columns:repeat(5,1fr);
      align-items:start;padding-top:10px}
    .tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);
      font-size:10.5px;font-weight:500;letter-spacing:0.01em}
    .tab .pill{width:54px;height:30px;border-radius:999px;display:flex;align-items:center;
      justify-content:center}
    .tab.on{color:var(--accent)} .tab.on .pill{background:var(--wash)}

    .mrow{display:flex;align-items:center;gap:13px;height:52px;border-bottom:1px solid var(--grid)}
    .box{width:21px;height:21px;flex:none;border-radius:7px;border:1.5px solid var(--axis);
      display:flex;align-items:center;justify-content:center}
    .box.on{background:var(--accent);border-color:var(--accent)}
    .track{height:5px;border-radius:999px;background:var(--grid);overflow:hidden}
    .fill{height:100%;background:var(--accent);border-radius:999px}
  </style>
</helmet>
<div class="screen">
  <div class="body">

    <div class="head"><h1>Trends</h1><p class="sub">How long the medication takes to peak.</p></div>
    <div class="rowx" style="gap:4px;padding:4px;border:1px solid var(--grid);background:var(--surface);border-radius:16px">
      <div style="flex-grow:1;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;color:var(--ink-2)">7d</div>
      <div style="flex-grow:1;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;background:var(--accent);color:var(--on-accent)">30d</div>
      <div style="flex-grow:1;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;color:var(--ink-2)">90d</div>
      <div style="flex-grow:1;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;color:var(--ink-2)">All</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">

        <div class="card stack" style="gap:2px;padding:14px 13px;border-radius:16px">
          <span style="font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);font-weight:600">Avg to peak</span>
          <span class="num" style="font-size:24px;line-height:1.2">2h 41m</span>
          <span style="font-size:11px;color:var(--ink-2)">&darr; 12m vs prior 30d</span>
        </div>

        <div class="card stack" style="gap:2px;padding:14px 13px;border-radius:16px">
          <span style="font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);font-weight:600">Peaks</span>
          <span class="num" style="font-size:24px;line-height:1.2">24</span>
        </div>

        <div class="card stack" style="gap:2px;padding:14px 13px;border-radius:16px">
          <span style="font-size:10.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);font-weight:600">Doses</span>
          <span class="num" style="font-size:24px;line-height:1.2">26</span>
        </div>
    </div>
    <div class="card stack" style="gap:4px">
      <span class="eyebrow">Time to peak</span>
      <p style="font-size:12.5px;color:var(--muted);line-height:1.5">Hours from dose to peak, one point per logged peak.</p>
      <svg viewBox="0 0 306 168" width="100%" height="168" style="margin-top:10px;overflow:visible">
        <line x1="0" y1="139.1" x2="306" y2="139.1" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="91.7" x2="306" y2="91.7" stroke="var(--grid)" stroke-width="1"/><line x1="0" y1="44.4" x2="306" y2="44.4" stroke="var(--grid)" stroke-width="1"/>
        <line x1="0" y1="44.4" x2="306" y2="44.4" stroke="var(--axis)" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="2" y="38.4" font-size="9.5" fill="var(--muted)" font-family="var(--ui)">wears off ~4 h</text>
        <polyline points="4.0,96.5 26.9,77.5 49.8,110.7 72.8,72.8 95.7,101.2 118.6,120.1 141.5,87.0 164.5,105.9 187.4,124.9 210.3,96.5 233.2,115.4 256.2,129.6 279.1,110.7 302.0,120.1" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="4.0" cy="96.5" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="26.9" cy="77.5" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="49.8" cy="110.7" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="72.8" cy="72.8" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="95.7" cy="101.2" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="118.6" cy="120.1" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="141.5" cy="87.0" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="164.5" cy="105.9" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="187.4" cy="124.9" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="210.3" cy="96.5" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="233.2" cy="115.4" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="256.2" cy="129.6" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="279.1" cy="110.7" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/><circle cx="302.0" cy="120.1" r="3.1" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.6"/>
        <text x="304" y="135.1" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--ui)">2h</text>
        <text x="304" y="87.7" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--ui)">3h</text>
        <text x="304" y="40.4" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="var(--ui)">4h</text>
      </svg>
    </div>
    <div class="card stack" style="gap:4px">
      <span class="eyebrow">How long it usually takes</span>
      <p style="font-size:12.5px;color:var(--muted);line-height:1.5">Number of peaks by hours after the dose.</p>
      <svg viewBox="0 0 306 132" width="100%" height="132" style="margin-top:10px">
        <line x1="0" y1="114" x2="306" y2="114" stroke="var(--grid)" stroke-width="1"/>
        <rect x="18.0" y="114.0" width="15" height="1.0" rx="4" fill="var(--accent)" opacity="0.25"/><text x="25.5" y="128" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--ui)">0h</text><rect x="69.0" y="105.0" width="15" height="9.0" rx="4" fill="var(--accent)" opacity="1"/><text x="76.5" y="128" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--ui)">1h</text><rect x="120.0" y="60.0" width="15" height="54.0" rx="4" fill="var(--accent)" opacity="1"/><text x="127.5" y="128" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--ui)">2h</text><rect x="171.0" y="6.0" width="15" height="108.0" rx="4" fill="var(--accent)" opacity="1"/><text x="178.5" y="128" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--ui)">3h</text><rect x="222.0" y="78.0" width="15" height="36.0" rx="4" fill="var(--accent)" opacity="1"/><text x="229.5" y="128" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--ui)">4h</text><rect x="273.0" y="105.0" width="15" height="9.0" rx="4" fill="var(--accent)" opacity="1"/><text x="280.5" y="128" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--ui)">5h</text>
      </svg>
    </div>
  </div>

      <nav class="tabbar">
        <div class="tab"><span class="pill"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13M5.5 12h13"/></svg></span>Log</div>
        <div class="tab"><span class="pill"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18.5h17L13.2 6.4a1.5 1.5 0 0 0-2.4 0z"/></svg></span>Peak</div>
        <div class="tab"><span class="pill"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 1.9"/></svg></span>History</div>
        <div class="tab"><span class="pill"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v18M4.2 3v4.6a2.8 2.8 0 0 0 5.6 0V3"/><path d="M16.8 21V3.4c1.9 1.3 3 3.6 3 6.2 0 2.5-1.1 4.4-3 5.1"/></svg></span>Meals</div>
        <div class="tab on"><span class="pill"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5l5-5 3.3 3.3L20 7.5m0 0h-4.3M20 7.5v4.3"/></svg></span>Trends</div>
      </nav>
</div>
</x-dc>
</body>
</html>
